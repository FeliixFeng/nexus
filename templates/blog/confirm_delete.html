{% extends 'base.html' %}

{% block title %}删除笔记 · Nexus{% endblock %}

{% block content %}
<div class="min-h-screen pt-24 pb-12 px-4">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-3xl font-bold text-white mb-8">确认删除</h1>
        
        <div class="bg-white/5 border border-white/10 rounded-2xl p-8">
            <p class="text-gray-300 mb-4">你确定要删除这篇笔记吗？</p>
            
            <div class="bg-white/5 rounded-lg p-4 mb-6">
                <h2 class="text-xl font-semibold text-white mb-2">{{ post.title }}</h2>
                <p class="text-gray-400 text-sm">发布于 {{ post.published_at|date:"Y-m-d H:i" }}</p>
            </div>
            
            <p class="text-red-400 text-sm mb-6">⚠️ 此操作不可撤销</p>
            
            <form method="post" class="flex items-center gap-4">
                {% csrf_token %}
                <button type="submit" 
                        class="px-6 py-3 bg-red-500/80 rounded-lg text-white font-medium hover:bg-red-500 transition-colors">
                    确认删除
                </button>
                <a href="{% url 'blog:post_detail' post.slug %}" 
                   class="px-6 py-3 bg-white/5 rounded-lg text-gray-300 hover:text-white hover:bg-white/10 transition-all">
                    取消
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% load static %}
<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nexus{% endblock %}</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                },
            },
        }
    </script>
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
    <!-- 导航栏 -->
    <nav class="fixed top-0 left-0 right-0 z-50 bg-gray-950/80 backdrop-blur-xl border-b border-gray-800/50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="{% url 'nexus_core:home' %}" class="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                Nexus
            </a>
            <div class="flex items-center space-x-6">
                <a href="{% url 'blog:post_list' %}" class="text-gray-400 hover:text-white transition-colors">笔记</a>
                <a href="{% url 'links:link_list' %}" class="text-gray-400 hover:text-white transition-colors">链接</a>
                <button id="pin-toggle" class="text-gray-500 hover:text-gray-300 transition-colors text-xl" onclick="togglePin()">
                    🔒
                </button>
            </div>
        </div>
    </nav>

    <!-- 主内容 -->
    <main class="pt-16">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-gray-800/50 py-8 mt-20">
        <div class="max-w-6xl mx-auto px-4 text-center text-gray-500 text-sm">
            © 2026 Nexus · Powered by Django
        </div>
    </footer>

    <!-- PIN验证模态框 -->
    <div id="pin-modal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-md" onclick="closePinModal()"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[90vw] max-w-sm">
            <div class="bg-gray-900/95 backdrop-blur-xl rounded-2xl p-6 md:p-8 border border-gray-700/50 shadow-2xl shadow-black/50">
                <!-- 标题 -->
                <div class="text-center mb-6">
                    <div class="text-3xl mb-3">🔐</div>
                    <h3 class="text-lg font-semibold text-white">管理密码</h3>
                    <p class="text-sm text-gray-400 mt-1">输入6位数字密码解锁编辑</p>
                </div>
                
                <!-- 6个密码框 -->
                <div class="flex justify-center gap-2 md:gap-3 mb-6">
                    <input type="tel" maxlength="1" class="pin-box" data-index="0" inputmode="numeric" pattern="[0-9]">
                    <input type="tel" maxlength="1" class="pin-box" data-index="1" inputmode="numeric" pattern="[0-9]">
                    <input type="tel" maxlength="1" class="pin-box" data-index="2" inputmode="numeric" pattern="[0-9]">
                    <input type="tel" maxlength="1" class="pin-box" data-index="3" inputmode="numeric" pattern="[0-9]">
                    <input type="tel" maxlength="1" class="pin-box" data-index="4" inputmode="numeric" pattern="[0-9]">
                    <input type="tel" maxlength="1" class="pin-box" data-index="5" inputmode="numeric" pattern="[0-9]">
                </div>
                
                <!-- 错误提示 -->
                <div id="pin-error" class="hidden text-center text-red-400 text-sm mb-4 shake">
                    密码错误，请重试
                </div>
                
                <!-- 按钮 -->
                <div class="flex gap-3">
                    <button onclick="closePinModal()" 
                            class="flex-1 py-3 px-4 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl transition-all duration-200 text-sm font-medium">
                        取消
                    </button>
                    <button onclick="verifyPin()" id="pin-submit"
                            class="flex-1 py-3 px-4 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white rounded-xl transition-all duration-200 text-sm font-medium shadow-lg shadow-blue-500/25">
                        确认
                    </button>
                </div>
            </div>
        </div>
    </div>

    <style>
        /* PIN输入框样式 */
        .pin-box {
            width: 46px;
            height: 56px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 600;
            color: white;
            background: rgba(31, 41, 55, 0.8);
            border: 2px solid rgba(75, 85, 99, 0.5);
            border-radius: 12px;
            outline: none;
            transition: all 0.2s ease;
            caret-color: transparent;
        }
        
        .pin-box:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: rgba(31, 41, 55, 1);
        }
        
        .pin-box.filled {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.1);
        }
        
        .pin-box.error {
            border-color: #ef4444;
            animation: shake 0.5s ease-in-out;
        }
        
        /* 移动端适配 */
        @media (max-width: 380px) {
            .pin-box {
                width: 40px;
                height: 48px;
                font-size: 1.25rem;
            }
        }
        
        /* 抖动动画 */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
            20%, 40%, 60%, 80% { transform: translateX(4px); }
        }
        
        .shake {
            animation: shake 0.5s ease-in-out;
        }
    </style>

    <script>
        // PIN输入框自动跳转逻辑
        const pinBoxes = document.querySelectorAll('.pin-box');
        
        pinBoxes.forEach((box, index) => {
            // 输入时自动跳到下一个
            box.addEventListener('input', (e) => {
                const value = e.target.value;
                
                // 只允许数字
                if (!/^\d$/.test(value)) {
                    e.target.value = '';
                    return;
                }
                
                // 标记已填充
                box.classList.add('filled');
                
                // 跳到下一个
                if (value && index < 5) {
                    pinBoxes[index + 1].focus();
                }
                
                // 全部填完自动提交
                if (index === 5 && value) {
                    setTimeout(verifyPin, 100);
                }
            });
            
            // 退格键跳到上一个
            box.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    pinBoxes[index - 1].focus();
                    pinBoxes[index - 1].value = '';
                    pinBoxes[index - 1].classList.remove('filled');
                }
            });
            
            // 聚焦时全选
            box.addEventListener('focus', () => {
                box.select();
            });
        });
        
        function togglePin() {
            const modal = document.getElementById('pin-modal');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                pinBoxes[0].focus();
            } else {
                closePinModal();
            }
        }
        
        function closePinModal() {
            document.getElementById('pin-modal').classList.add('hidden');
            pinBoxes.forEach(box => {
                box.value = '';
                box.classList.remove('filled', 'error');
            });
            document.getElementById('pin-error').classList.add('hidden');
        }
        
        function getPin() {
            let pin = '';
            pinBoxes.forEach(box => pin += box.value);
            return pin;
        }
        
        function showError() {
            document.getElementById('pin-error').classList.remove('hidden');
            pinBoxes.forEach(box => {
                box.value = '';
                box.classList.remove('filled');
                box.classList.add('error');
            });
            setTimeout(() => {
                pinBoxes.forEach(box => box.classList.remove('error'));
                pinBoxes[0].focus();
            }, 500);
        }
        
        function verifyPin() {
            const pin = getPin();
            if (pin.length !== 6) return;
            
            // 获取CSRF token
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value 
                || document.cookie.split('; ').find(row => row.startsWith('csrftoken='))?.split('=')[1]
                || '';
            
            fetch('/api/verify-pin/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken,
                },
                body: JSON.stringify({pin: pin})
            })
            .then(r => r.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('pin-toggle').textContent = '🔓';
                    document.body.classList.add('pin-unlocked');
                    closePinModal();
                    location.reload();
                } else {
                    showError();
                }
            })
            .catch(() => {
                showError();
            });
        }
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="zh-CN" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Nexus">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <link rel="apple-touch-icon" href="{% static 'apple-touch-icon.png' %}">
    <title>{% block title %}Nexus · FelixFeng{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('{% static "sw.js" %}');
        }
        try {
            if (localStorage.getItem('nexus_reduced_motion') === '1') {
                document.documentElement.classList.add('nexus-reduced-motion');
            }
        } catch (e) {}
    </script>
    
    <!-- Tailwind CSS CDN -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Display Font：异步加载，fonts.googleapis.com 不可达时不能阻塞首屏渲染 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap" rel="stylesheet"></noscript>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Noto Sans SC', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                        display: ['Space Grotesk', 'Inter', 'system-ui', 'sans-serif'],
                    },
                },
            },
        }
    </script>
    
    <!-- HTMX：defer 避免阻塞解析，仅研究页用到，DOMContentLoaded 前加载完即可 -->
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/custom.css' %}?v=20260930b">
    <link rel="stylesheet" href="{% static 'css/base.css' %}?v=20260930b">
    
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex flex-col {% if is_editor %}pin-unlocked{% endif %}" tabindex="-1">
    <div id="nav-progress" aria-hidden="true"></div>
    {% include 'components/navbar.html' %}

    <!-- 主内容 -->
    <main class="pt-14 flex-1">
        {% block content %}{% endblock %}
    </main>



    <!-- 回到顶部 -->
    <button id="back-to-top" 
            class="fixed bottom-6 right-6 z-40 w-10 h-10 rounded-full bg-gray-900/80 backdrop-blur-xl border border-gray-700/40 text-gray-400 hover:text-white hover:border-blue-500/40 hover:bg-gray-800/80 transition-all duration-300 flex items-center justify-center shadow-lg shadow-black/30"
            onclick="window.scrollTo({top:0, behavior:'smooth'})">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7"/>
        </svg>
    </button>

    {% include 'components/pin_modal.html' %}

    <script src="{% static 'js/base.js' %}?v=20260930b"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>

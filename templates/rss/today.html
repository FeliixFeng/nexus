{% extends 'rss/_shell.html' %}

{% block feed_body %}
<section class="mt-4 nx-enter nx-delay-1">
    <h2 class="nx-section-label">日报 · {{ briefs|length }}</h2>
    <div class="nx-stack feed-brief-list">
        {% for brief in briefs %}
        <article class="nx-card feed-card">
            <div class="feed-card-top">
                <span class="nx-icon" aria-hidden="true">📰</span>
                <div class="min-w-0 flex-1">
                    <div class="feed-card-meta">
                        <span class="nx-chip feed-chip-type">日报</span>
                        <span class="nx-chip feed-chip-muted">{{ brief.date }}</span>
                        <span class="feed-score">{{ brief.item_count }}</span>
                    </div>
                    <h3 class="nx-card-title mt-3 line-clamp-2">
                        <a class="feed-card-title-link" href="{% url 'rss:brief_day' brief.date %}">{{ brief.title }}</a>
                    </h3>
                    {% if brief.lead %}
                    <p class="nx-card-desc mt-2 line-clamp-2">{{ brief.lead }}</p>
                    {% endif %}
                </div>
                <div class="feed-card-actions">
                    <a class="feed-btn feed-go" href="{% url 'rss:brief_day' brief.date %}" tabindex="-1" aria-hidden="true">阅读全文 →</a>
                </div>
            </div>
        </article>
        {% empty %}
        <p class="nx-empty">还没有日报。每天 06:00 拉取后自动生成。</p>
        {% endfor %}
    </div>
</section>
{% endblock %}

{% load static %}
{% load nx_icons %}
{% comment %} 优先站点 favicon（经本站代理），失败回退 emoji {% endcomment %}
<span class="nx-icon {% if large %}lg{% endif %}" data-link-icon>
    <img
        class="nx-favicon"
        src="{{ link.url|favicon_url }}"
        alt=""
        width="32"
        height="32"
        loading="lazy"
        decoding="async"
        referrerpolicy="no-referrer"
        onerror="this.style.display='none'; this.parentNode.classList.add('is-fallback');"
        onload="if(!this.naturalWidth){this.style.display='none'; this.parentNode.classList.add('is-fallback');}"
    />
    <span class="nx-emoji-fallback">{{ link.icon|default:"🔗" }}</span>
</span>

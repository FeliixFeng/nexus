{% load static %}
{% comment %} 优先使用仓库内固定图标 icon_file，否则 emoji {% endcomment %}
<span class="nx-icon {% if large %}lg{% endif %}" data-link-icon>
    {% if link.icon_file %}
    <img
        class="nx-favicon"
        src="{% static 'icons/links/' %}{{ link.icon_file }}"
        alt=""
        width="32"
        height="32"
        loading="lazy"
        decoding="async"
        onerror="this.style.display='none'; this.parentNode.classList.add('is-fallback');"
    />
    <span class="nx-emoji-fallback">{{ link.icon|default:"🔗" }}</span>
    {% else %}
    <span class="nx-emoji-fallback is-shown">{{ link.icon|default:"🔗" }}</span>
    {% endif %}
</span>

<!-- PIN验证模态框 -->
<div id="pin-modal" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/70 backdrop-blur-md" onclick="closePinModal()"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[90vw] max-w-sm">
        <div class="bg-gray-900/95 backdrop-blur-xl rounded-2xl p-6 md:p-8 border border-gray-700/50 shadow-2xl shadow-black/50">
            <!-- 标题 -->
            <div class="text-center mb-6">
                <div class="text-3xl mb-3">🔐</div>
                <h3 class="text-lg font-semibold text-white">管理密码</h3>
                <p class="text-sm text-gray-400 mt-1">输入6位数字密码解锁编辑</p>
            </div>
            
            <!-- 6个密码框 -->
            <div class="flex justify-center gap-2 md:gap-3 mb-6">
                <input type="tel" maxlength="1" class="pin-box" data-index="0" inputmode="numeric" pattern="[0-9]">
                <input type="tel" maxlength="1" class="pin-box" data-index="1" inputmode="numeric" pattern="[0-9]">
                <input type="tel" maxlength="1" class="pin-box" data-index="2" inputmode="numeric" pattern="[0-9]">
                <input type="tel" maxlength="1" class="pin-box" data-index="3" inputmode="numeric" pattern="[0-9]">
                <input type="tel" maxlength="1" class="pin-box" data-index="4" inputmode="numeric" pattern="[0-9]">
                <input type="tel" maxlength="1" class="pin-box" data-index="5" inputmode="numeric" pattern="[0-9]">
            </div>
            
            <!-- 错误提示 -->
            <div id="pin-error" class="hidden text-center text-red-400 text-sm mb-4 shake">
                密码错误，请重试
            </div>
            
            <!-- 按钮 -->
            <div class="flex gap-3">
                <button onclick="closePinModal()" 
                        class="flex-1 py-3 px-4 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl transition-all duration-200 text-sm font-medium">
                    取消
                </button>
                <button onclick="verifyPin()" id="pin-submit"
                        class="flex-1 py-3 px-4 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white rounded-xl transition-all duration-200 text-sm font-medium shadow-lg shadow-blue-500/25">
                    确认
                </button>
            </div>
        </div>
    </div>
</div>

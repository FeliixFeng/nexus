{% load static %}
<!-- 导航栏（桌面端顶部） -->
<nav id="navbar" class="nav-wrapper nav-transparent fixed top-0 left-0 right-0 z-50 backdrop-blur-xl border-b hidden md:block" style="border-bottom-color: rgba(99, 102, 241, 0.25);">
    <div class="nav-glow"></div>
    <div class="mx-auto px-6 md:px-10 h-14 flex items-center justify-between max-w-[82vw]">
        <a href="{% url 'nexus_core:home' %}" class="flex items-center gap-2 group">
            <img src="{% static 'favicon.svg' %}" alt="N" class="w-7 h-7 rounded-lg group-hover:scale-110 transition-transform duration-200">
            <span class="text-lg font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent tracking-tight">
                Nexus
            </span>
        </a>
        <div class="flex items-center gap-1">
            <a href="{% url 'nexus_core:home' %}" 
               class="nav-link px-3 py-1.5 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-white/5 {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
                首页
            </a>
            <a href="{% url 'blog:post_list' %}" 
               class="nav-link px-3 py-1.5 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-white/5 {% if 'blog' in request.resolver_match.app_name %}active{% endif %}">
                笔记
            </a>
            <a href="{% url 'links:link_list' %}" 
               class="nav-link px-3 py-1.5 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-white/5 {% if 'links' in request.resolver_match.app_name %}active{% endif %}">
                链接
            </a>
            <a href="{% url 'nexus_core:now_page' %}" 
               class="nav-link px-3 py-1.5 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-white/5 {% if request.resolver_match.url_name == 'now_page' %}active{% endif %}">
                动态
            </a>
            <a href="{% url 'nexus_core:monitor' %}" 
               class="nav-link px-3 py-1.5 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-white/5 {% if request.resolver_match.url_name == 'monitor' %}active{% endif %}">
                监控
            </a>
            <a href="{% url 'research:research_home' %}" 
               class="nav-link px-3 py-1.5 text-sm text-gray-400 hover:text-white rounded-lg hover:bg-white/5 {% if 'research' in request.resolver_match.app_name %}active{% endif %}">
                学术
            </a>
            
            <div class="w-px h-4 bg-gray-700/50 mx-2"></div>
            <span id="nav-clock" class="text-xs text-gray-500 font-mono tabular-nums"></span>
            <button id="pin-toggle" class="ml-2 text-gray-500 hover:text-gray-300 transition-colors text-base w-8 h-8 flex items-center justify-center rounded-lg hover:bg-white/5" onclick="togglePin()">
                {% if is_editor %}🔓{% else %}🔒{% endif %}
            </button>
        </div>
    </div>
</nav>

<!-- 移动端顶部栏（简化版） -->
<nav id="mobile-topbar" class="md:hidden fixed top-0 left-0 right-0 z-50 backdrop-blur-xl border-b" style="border-bottom-color: rgba(99, 102, 241, 0.25);">
    <div class="h-11 flex items-center justify-between px-4">
        <a href="{% url 'nexus_core:home' %}" class="flex items-center gap-1.5">
            <img src="{% static 'favicon.svg' %}" alt="N" class="w-5 h-5 rounded">
            <span class="text-sm font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">Nexus</span>
        </a>
        <div class="flex items-center gap-1">
            <span id="nav-clock-mobile" class="text-[10px] text-gray-500 font-mono tabular-nums"></span>
            <button id="pin-toggle-mobile" class="text-gray-500 hover:text-gray-300 transition-colors w-7 h-7 flex items-center justify-center rounded-lg" onclick="togglePin()">
                {% if is_editor %}🔓{% else %}🔒{% endif %}
            </button>
        </div>
    </div>
</nav>

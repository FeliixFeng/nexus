{% extends 'base.html' %}

{% block title %}监控 · Nexus{% endblock %}

{% block extra_css %}
<style>
    .server-card {
        background: rgba(17, 24, 39, 0.6);
        border: 1px solid rgba(75, 85, 99, 0.25);
        border-radius: 16px;
        padding: 24px;
        transition: all 0.3s ease;
    }
    .server-card.offline {
        border-color: rgba(220, 38, 38, 0.25);
    }


    .status-dot {
        width: 8px; height: 8px;
        border-radius: 50%;
        display: inline-block;
        flex-shrink: 0;
    }
    .status-dot.online {
        background: #34d399;
        box-shadow: 0 0 8px rgba(52, 211, 153, 0.5);
    }
    .status-dot.offline {
        background: #f87171;
        box-shadow: 0 0 8px rgba(248, 113, 113, 0.5);
    }

    .metric-bar {
        height: 6px;
        border-radius: 3px;
        background: rgba(55, 65, 81, 0.5);
        overflow: hidden;
    }
    .metric-bar-fill {
        height: 100%;
        border-radius: 3px;
        transition: width 0.6s ease;
    }
    .metric-bar-fill.normal { background: linear-gradient(90deg, #6366f1, #818cf8); }
    .metric-bar-fill.warning { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
    .metric-bar-fill.danger { background: linear-gradient(90deg, #ef4444, #f87171); }

    .metric-label {
        font-size: 0.75rem;
        color: rgba(156, 163, 175, 0.7);
        margin-bottom: 4px;
    }
    .metric-value {
        font-size: 0.88rem;
        color: #e5e7eb;
        font-weight: 500;
    }

    .container-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 10px;
        border-radius: 8px;
        font-size: 0.75rem;
        background: rgba(31, 41, 55, 0.6);
        border: 1px solid rgba(75, 85, 99, 0.3);
        color: #9ca3af;
    }
    .container-chip.running { border-color: rgba(52, 211, 153, 0.3); }
    .container-chip .chip-dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
    }
    .container-chip .chip-dot.running { background: #34d399; }
    .container-chip .chip-dot.stopped { background: #f87171; }

    .info-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 6px 0;
        font-size: 0.82rem;
    }
    .info-row .label { color: rgba(156, 163, 175, 0.6); }
    .info-row .value { color: #d1d5db; }

    /* fadeInUp animation */
    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(24px); }
        to   { opacity: 1; transform: translateY(0); }
    }
    .server-card {
        opacity: 0;
        animation: fadeInUp 0.5s ease forwards;
    }
    .server-card:nth-child(1)  { animation-delay: 0.05s; }
    .server-card:nth-child(2)  { animation-delay: 0.12s; }
    .server-card:nth-child(3)  { animation-delay: 0.19s; }
    .server-card:nth-child(4)  { animation-delay: 0.26s; }
    .server-card:nth-child(5)  { animation-delay: 0.33s; }
    .server-card:nth-child(6)  { animation-delay: 0.40s; }
    .server-card:nth-child(7)  { animation-delay: 0.47s; }
    .server-card:nth-child(8)  { animation-delay: 0.54s; }
    .server-card:nth-child(9)  { animation-delay: 0.61s; }
    .server-card:nth-child(10) { animation-delay: 0.68s; }

    /* hover glow */
    .server-card:hover {
        border-color: rgba(99, 102, 241, 0.45);
        box-shadow: 0 0 28px rgba(99, 102, 241, 0.10), 0 0 60px rgba(99, 102, 241, 0.04);
        transform: translateY(-2px);
    }
    .server-card.offline:hover {
        border-color: rgba(220, 38, 38, 0.45);
        box-shadow: 0 0 28px rgba(220, 38, 38, 0.10), 0 0 60px rgba(220, 38, 38, 0.04);
    }

    /* count badge */
    .count-badge {
        display: inline-flex; align-items: center; justify-content: center;
        min-width: 1.5rem; height: 1.5rem; padding: 0 6px;
        border-radius: 9999px; font-size: 0.7rem; font-weight: 600;
        background: rgba(99, 102, 241, 0.15); color: #a5b4fc;
        border: 1px solid rgba(99, 102, 241, 0.2);
    }

    /* empty state */
    .empty-state {
        opacity: 0; animation: fadeInUp 0.5s ease forwards; animation-delay: 0.1s;
    }

    @keyframes pulse-green {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
    .pulse { animation: pulse-green 2s ease-in-out infinite; }

    /* 骨架屏 */
    .skeleton {
        background: linear-gradient(90deg, rgba(55,65,81,0.3) 25%, rgba(75,85,99,0.3) 50%, rgba(55,65,81,0.3) 75%);
        background-size: 200% 100%;
        animation: shimmer 1.5s infinite;
        border-radius: 6px;
    }
    @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }
</style>
{% endblock %}

{% block content %}
<div class="mx-auto px-3 md:px-10 pt-8 pb-6 max-w-full md:max-w-[82vw]">
    <!-- 标题 -->
    <div class="text-center mb-10">
        <h1 class="text-xs font-medium text-blue-400/70 uppercase tracking-[0.3em] mb-2">Monitor</h1>
        <h2 class="text-2xl md:text-3xl font-bold text-white">服务器监控 <span id="count-badge" class="count-badge align-middle ml-1" style="display:none;"></span></h2>
        <div class="w-16 h-px bg-gradient-to-r from-transparent via-blue-500/40 to-transparent mx-auto mt-4"></div>
        <p id="summary" class="text-sm text-gray-500 mt-4">
            <span class="skeleton inline-block w-24 h-4"></span>
        </p>
    </div>

    <!-- 服务器卡片容器 -->
    <div id="server-cards" class="grid grid-cols-1 md:grid-cols-2 gap-12 mb-8">
        {% for name in server_names %}
        <div class="server-card" id="card-{{ name }}">
            <div class="flex items-center justify-between mb-4">
                <div class="flex items-center gap-2">
                    <span class="status-dot offline" id="status-{{ name }}"></span>
                    <span class="text-lg font-bold text-white">{{ name }}</span>
                    <span class="text-xs text-gray-600 font-mono" id="meta-{{ name }}"></span>
                </div>
            </div>
            <!-- 骨架占位 -->
            <div class="space-y-4" id="skeleton-{{ name }}">
                <div class="skeleton h-4 w-full"></div>
                <div class="skeleton h-4 w-3/4"></div>
                <div class="skeleton h-4 w-full"></div>
                <div class="skeleton h-4 w-2/3"></div>
            </div>
            <!-- 真实数据（隐藏） -->
            <div class="space-y-4 hidden" id="data-{{ name }}"></div>
        </div>
        {% endfor %}
    </div>

    <!-- 空状态 -->
    <div id="empty-state" class="empty-state text-center py-20 hidden">
        <p class="text-5xl mb-4">🖥️</p>
        <p class="text-gray-500 text-sm">暂无服务器</p>
        <p class="text-gray-700 text-xs mt-1">在 settings.py 中配置 MONITOR_SERVERS 开始监控</p>
    </div>

    <p class="text-center text-xs text-gray-700 mt-6" id="refresh-info"></p>
</div>
{% endblock %}

{% block extra_js %}
<script>
function barClass(pct) {
    if (pct > 80) return 'danger';
    if (pct > 50) return 'warning';
    return 'normal';
}

function renderServer(s) {
    const card = document.getElementById('card-' + s.name);
    const statusDot = document.getElementById('status-' + s.name);
    const meta = document.getElementById('meta-' + s.name);
    const skeleton = document.getElementById('skeleton-' + s.name);
    const container = document.getElementById('data-' + s.name);

    skeleton.classList.add('hidden');
    container.classList.remove('hidden');

    if (!s.online) {
        card.classList.add('offline');
        statusDot.className = 'status-dot offline';
        meta.textContent = '';
        container.innerHTML = '<p class="text-gray-600 text-sm text-center py-6">' + (s.error || '无法连接') + '</p>';
        return;
    }

    card.classList.remove('offline');
    statusDot.className = 'status-dot online';
    meta.textContent = s.platform + '/' + s.arch;

    let html = '';

    // 运行时间 + 最后更新
    html += '<div class="flex justify-between items-center mb-2">';
    html += '<span class="text-xs text-gray-600">运行 <span class="text-gray-400 font-mono">' + s.uptime + '</span></span>';
    if (s.collected_at) {
        const t = new Date(s.collected_at);
        const hm = String(t.getHours()).padStart(2,'0') + ':' + String(t.getMinutes()).padStart(2,'0');
        html += '<span class="text-xs text-gray-700 font-mono">' + hm + '</span>';
    }
    html += '</div>';

    // CPU
    html += '<div><div class="flex justify-between items-center mb-1.5"><span class="metric-label">CPU</span><span class="metric-value">' + s.cpu_percent + '%</span></div>';
    html += '<div class="metric-bar"><div class="metric-bar-fill ' + barClass(s.cpu_percent) + '" style="width:' + s.cpu_percent + '%"></div></div>';
    html += '<div class="flex justify-between mt-1"><span class="text-xs text-gray-600">' + s.cpu_count + ' 核</span><span class="text-xs text-gray-600">负载 ' + s.load_avg.join(' ') + '</span></div></div>';

    // 内存
    html += '<div><div class="flex justify-between items-center mb-1.5"><span class="metric-label">内存</span><span class="metric-value">' + s.mem_used + ' / ' + s.mem_total + ' GB</span></div>';
    html += '<div class="metric-bar"><div class="metric-bar-fill ' + barClass(s.mem_percent) + '" style="width:' + s.mem_percent + '%"></div></div></div>';

    // 磁盘
    html += '<div><div class="flex justify-between items-center mb-1.5"><span class="metric-label">磁盘</span><span class="metric-value">' + s.disk_used + ' / ' + s.disk_total + ' GB</span></div>';
    html += '<div class="metric-bar"><div class="metric-bar-fill ' + barClass(s.disk_percent) + '" style="width:' + s.disk_percent + '%"></div></div></div>';

    // 电池（仅笔记本）
    if (s.battery) {
        let batLabel = s.battery.percent + '%';
        if (s.battery.plugged) batLabel += ' <span class="text-xs text-green-400 ml-1">⚡</span>';
        const batClass = s.battery.percent < 20 ? 'danger' : s.battery.percent < 40 ? 'warning' : 'normal';
        html += '<div><div class="flex justify-between items-center mb-1.5"><span class="metric-label">🔋 电池</span><span class="metric-value">' + batLabel + '</span></div>';
        html += '<div class="metric-bar"><div class="metric-bar-fill ' + batClass + '" style="width:' + s.battery.percent + '%"></div></div></div>';
    }

    // Docker
    if (s.containers && s.containers.length > 0) {
        html += '<div class="pt-2 border-t border-gray-800/40"><div class="flex justify-between items-center mb-2"><span class="metric-label">🐳 容器</span><span class="text-xs text-gray-500">' + s.containers_running + '/' + s.containers_total + ' 运行中</span></div>';
        html += '<div class="flex flex-wrap gap-1.5">';
        s.containers.forEach(function(c) {
            const isUp = c.status.startsWith('Up');
            html += '<span class="container-chip' + (isUp ? ' running' : '') + '"><span class="chip-dot ' + (isUp ? 'running' : 'stopped') + '"></span>' + c.name + '</span>';
        });
        html += '</div></div>';
    }

    container.innerHTML = html;
}

function loadData() {
    fetch('/api/monitor/data/')
        .then(r => r.json())
        .then(data => {
            // 更新摘要
            let summary = '<span class="status-dot online pulse"></span>';
            summary += ' <span class="ml-1">' + data.online + '/' + data.total + ' 在线</span>';
            if (data.containers_count > 0) {
                summary += '<span class="mx-2 text-gray-700">·</span><span>' + data.containers_count + ' 个容器</span>';
            }
            document.getElementById('summary').innerHTML = summary;

            // count badge
            const badge = document.getElementById('count-badge');
            if (data.total > 0) {
                badge.textContent = data.total;
                badge.style.display = '';
            } else {
                badge.style.display = 'none';
            }

            // 空状态
            const emptyState = document.getElementById('empty-state');
            if (data.total === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }

            // 渲染每台服务器
            data.servers.forEach(renderServer);

            // 刷新提示
            document.getElementById('refresh-info').textContent = '数据每 30 秒自动刷新';
        })
        .catch(err => {
            document.getElementById('summary').innerHTML = '<span class="text-red-400">加载失败，30秒后重试</span>';
        });
}

// 页面加载后立即请求数据
loadData();
// 每 30 秒刷新
setInterval(loadData, 30000);
</script>
{% endblock %}

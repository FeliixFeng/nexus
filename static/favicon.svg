<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#111128"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <linearGradient id="line1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:0.6"/>
    </linearGradient>
    <linearGradient id="line2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.6"/>
    </linearGradient>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  
  <!-- 背景光晕 -->
  <circle cx="256" cy="256" r="160" fill="#6366f1" opacity="0.06" filter="url(#blur1)"/>
  <circle cx="200" cy="200" r="100" fill="#8b5cf6" opacity="0.04" filter="url(#blur1)"/>
  
  <!-- N 字形 - 三条线组成 -->
  <!-- 左竖线 -->
  <line x1="152" y1="360" x2="152" y2="152" stroke="url(#line1)" stroke-width="36" stroke-linecap="round"/>
  <!-- 斜线 -->
  <line x1="152" y1="152" x2="360" y2="360" stroke="url(#glow)" stroke-width="36" stroke-linecap="round"/>
  <!-- 右竖线 -->
  <line x1="360" y1="152" x2="360" y2="360" stroke="url(#line2)" stroke-width="36" stroke-linecap="round"/>
  
  <!-- 连接点光效 -->
  <circle cx="152" cy="152" r="8" fill="#a78bfa" filter="url(#blur2)"/>
  <circle cx="152" cy="152" r="4" fill="#e0e7ff"/>
  <circle cx="360" cy="360" r="8" fill="#6366f1" filter="url(#blur2)"/>
  <circle cx="360" cy="360" r="4" fill="#e0e7ff"/>
  <circle cx="360" cy="152" r="8" fill="#8b5cf6" filter="url(#blur2)"/>
  <circle cx="360" cy="152" r="4" fill="#e0e7ff"/>
  <circle cx="152" cy="360" r="6" fill="#6366f1" filter="url(#blur2)"/>
  <circle cx="152" cy="360" r="3" fill="#c7d2fe"/>
</svg>

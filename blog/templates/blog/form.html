{% extends 'base.html' %}

{% block title %}Nexus{% endblock %}

{% block extra_css %}
<style>
    .form-input {
        background: rgba(17, 24, 39, 0.6);
        border: 1px solid rgba(55, 65, 81, 0.5);
        border-radius: 10px;
        padding: 10px 14px;
        color: #e5e7eb;
        font-size: 0.95rem;
        transition: all 0.2s;
        width: 100%;
        outline: none;
    }
    .form-input:focus {
        border-color: rgba(99, 102, 241, 0.5);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }
    .form-input::placeholder { color: #4b5563; }
    textarea.form-input {
        min-height: 400px;
        resize: vertical;
        font-family: 'JetBrains Mono', 'Fira Code', monospace;
        font-size: 0.88rem;
        line-height: 1.7;
    }
    .form-label {
        display: block;
        font-size: 0.8rem;
        font-weight: 500;
        color: #9ca3af;
        margin-bottom: 6px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
    }
</style>
{% endblock %}

{% block content %}
<div class="mx-auto px-6 md:px-12 py-12 max-w-3xl">
    <!-- 返回 -->
    <a href="{% if post %}{% url 'blog:post_detail' post.slug %}{% else %}{% url 'blog:post_list' %}{% endif %}" 
       class="back-link inline-flex items-center gap-1 text-gray-500 hover:text-white text-sm mb-8">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
        </svg>
        返回
    </a>

    <h1 class="text-2xl font-bold text-white mb-8">
        {% if post %}编辑笔记{% else %}新建笔记{% endif %}
    </h1>

    {% if error %}
    <div class="bg-red-500/10 border border-red-500/30 text-red-400 px-4 py-3 rounded-xl mb-6 text-sm">
        {{ error }}
    </div>
    {% endif %}

    <form method="post" class="space-y-6">
        {% csrf_token %}
        
        <!-- 标题 -->
        <div>
            <label class="form-label">标题</label>
            <input type="text" name="title" value="{{ title }}" class="form-input" placeholder="输入笔记标题..." autofocus>
        </div>

        <!-- 摘要 -->
        <div>
            <label class="form-label">摘要 <span class="text-gray-600">(可选)</span></label>
            <input type="text" name="summary" value="{{ summary }}" class="form-input" placeholder="一句话描述...">
        </div>

        <!-- 标签 -->
        <div>
            <label class="form-label">标签 <span class="text-gray-600">(逗号分隔)</span></label>
            <input type="text" name="tags" value="{{ tag_names }}" class="form-input" placeholder="技术, Django, Python">
        </div>

        <!-- 状态 + 置顶 -->
        <div class="flex gap-6 items-end">
            <div class="flex-1">
                <label class="form-label">状态</label>
                <select name="status" class="form-input">
                    <option value="published" {% if status == 'published' %}selected{% endif %}>已发布</option>
                    <option value="draft" {% if status == 'draft' %}selected{% endif %}>草稿</option>
                </select>
            </div>
            <div class="pb-2">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="is_pinned" {% if is_pinned %}checked{% endif %}
                           class="w-4 h-4 rounded border-gray-600 bg-gray-800 text-indigo-500 focus:ring-indigo-500/30">
                    <span class="text-sm text-gray-400">置顶</span>
                </label>
            </div>
        </div>

        <!-- 内容 -->
        <div>
            <label class="form-label">内容 <span class="text-gray-600">(Markdown)</span></label>
            <textarea name="content" class="form-input" placeholder="在这里写 Markdown 内容...">{{ content }}</textarea>
        </div>

        <!-- 提交 -->
        <div class="flex gap-3 pt-2">
            <button type="submit" 
                    class="px-6 py-2.5 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white rounded-xl text-sm font-medium transition-all shadow-lg shadow-blue-500/20">
                {% if post %}保存修改{% else %}发布笔记{% endif %}
            </button>
            <a href="{% if post %}{% url 'blog:post_detail' post.slug %}{% else %}{% url 'blog:post_list' %}{% endif %}"
               class="px-6 py-2.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-xl text-sm font-medium transition-all">
                取消
            </a>
        </div>
    </form>
</div>
{% endblock %}
